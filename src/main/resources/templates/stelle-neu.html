<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    </head>

    <body>

        <!-- Hamburger Menü -->
        <button class="hamburger" onclick="menuOeffnen()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Menü, das aufgeht -->
        <div class="nav-overlay" id="menu">

            <button class="close-btn" onclick="menuSchliessen()">
                ✕
            </button>

            <nav>
                <a href="/startseite">Startseite</a>
                <a href="/login">Login</a>
                <a href="/registrieren">Registrieren</a>
            </nav>

        </div>
        <form th:action="@{/stellen/neu}" method="post">
            <input type="text" name="titel" placeholder="Titel">
            <input type="text" name="beschreibung" placeholder="Beschreibung">
            <input type="text" name="typ" placeholder="Typ">
            <input type="text" name="standort" placeholder="Standort">
            <input type="text" name="arbeitsbereich" placeholder="Arbeitsbereich">
            <select name="karrierestatus">

                <option value="STUDENT">
                    Student
                </option>

                <option value="EINSTEIGER">
                    Einsteiger
                </option>

                <option value="EXPERTE">
                    Experte
                </option>

            </select>
            <button type="submit">Anlegen</button>
        </form>

        <script>
            function menuOeffnen() {
                document.getElementById("menu").style.display = "flex";
            }

            function menuSchliessen() {
                document.getElementById("menu").style.display = "none";
            }
        </script>
    </body>
</html>
