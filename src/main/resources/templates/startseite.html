<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    </head>

    <body>
        <!-- Hamburger Menü -->
        <button class="hamburger" onclick="menuOeffnen()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Menü, das aufgeht -->
        <div class="nav-overlay" id="menu">

            <button class="close-btn" onclick="menuSchliessen()">
            ✕
            </button>

            <nav>
                <a href="/startseite">Startseite</a>
                <a href="/login">Login</a>
                <a href="/registrieren">Registrieren</a>
            </nav>

        </div>

        <div class="hero">
            <h1>Catchphrase</h1>
            <p>Längerer Spruch.</p>
        </div>

        <div class="container">
            <!-- DropDown-Menü -->
            <h2>Du suchst nach etwas spezifischen?</h2>

            <form th:action="@{/stellen/suche}" method="get">

                <div class="search-row"><!-- öffnet den Wrapper -->

                    <label>Arbeitsbereich:</label>
                    <select name="arbeitsbereich">
                        <option value="IT">IT</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Personal">Personal</option>
                        <option value="Vertrieb">Vertrieb</option>
                    </select>

                    <label>Karrierestatus:</label>
                    <select name="karrierestatus">
                        <option value="STUDENT">Student</option>
                        <option value="EINSTEIGER">Einsteiger</option>
                        <option value="EXPERTE">Experte</option>
                    </select>

                </div><!-- schließt den Wrapper, VOR dem Button -->

                <button type="submit">
                    Suchen
                </button>

            </form>

            <!--offene Stellen-->
            <h2>Unsere offene Stellen</h2>

            <div class="job-list">
                <div class="job-card" th:each="stelle : ${stellen}">
                    <h3 th:text="${stelle.titel}"></h3>

                    <p>
                        Standort:
                        <span th:text="${stelle.standort}"></span>
                    </p>

                    <p>
                        Art:
                        <span th:text="${stelle.typ}"></span>
                    </p>

                    <a th:href="@{/stellen/{id}(id=${stelle.id})}">
                        Mehr erfahren
                    </a>

                </div>
            </div>

            <!--Warum man dazugehört Teil -->
            <div class="team">
                <h2>Warum du zu unserem Team gehörst</h2>
                <div class="features-list">
                    <div class="feature-card">
                        <h3>Flexible Arbeitszeiten</h3>
                        <p>Lorem ipsum</p>
                    </div>
                    <div class="feature-card">
                        <h3>Remote-freundlich</h3>
                        <p>Lorem ipsum</p>
                    </div>
                    <div class="feature-card">
                        <h3>Modernes Team</h3>
                        <p>Lorem ipsum</p>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function menuOeffnen() {
                document.getElementById("menu").style.display = "flex";
            }

            function menuSchliessen() {
                document.getElementById("menu").style.display = "none";
            }
        </script>
    </body>
</html>
