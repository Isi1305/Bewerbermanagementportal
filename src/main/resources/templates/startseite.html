<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    </head>

    <body>
        <h1>Catchphrase</h1>
        <p>Längerer Spruch.</p>

        <!-- DropDown-Menü -->
        <h2>Du suchst nach etwas spezifischen?</h2>

        <form th:action="@{/stellen/suche}" method="get">

            <label>Arbeitsbereich:</label>

            <select name="arbeitsbereich">

                <option value="IT">
                    IT
                </option>

                <option value="Marketing">
                    Marketing
                </option>

                <option value="Personal">
                    Personal
                </option>

                <option value="Vertrieb">
                    Vertrieb
                </option>

            </select>


            <label>Karrierestatus:</label>

            <select name="karrierestatus">

                <option value="STUDENT">
                    Student
                </option>

                <option value="EINSTEIGER">
                    Einsteiger
                </option>

                <option value="EXPERTE">
                    Experte
                </option>

            </select>


            <button type="submit">
                Suchen
            </button>

        </form>

        <!--offene Stellen-->
        <h2>Unsere offene Stellen</h2>

        <div th:each="stelle : ${stellen}">
            <h3 th:text="${stelle.titel}"></h3>

            <p>
                Standort:
                <span th:text="${stelle.standort}"></span>
            </p>

            <p>
                Art:
                <span th:text="${stelle.typ}"></span>
            </p>

            <a th:href="@{/stellen/{id}(id=${stelle.id})}">
                Mehr erfahren
            </a>

        </div>

        <!--Warum man dazugehört Teil -->
        <h2>Warum du zu unserem Team gehörst</h2>
        <div>
            <h3>Flexible Arbeitszeiten</h3>
            <p>Lorem ipsum</p>
        </div>
        <div>
            <h3>Remote-freundlich</h3>
            <p>Lorem ipsum</p>
        </div>
        <div>
            <h3>Modernes Team</h3>
            <p>Lorem ipsum</p>
        </div>
    </body>
</html>
