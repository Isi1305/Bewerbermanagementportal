<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>
    <h1>Alle Stellen</h1>
    <ul>
        <li th:each="stelle : ${stellen}">
            <a th:href="@{/stellen/{id}(id=${stelle.id})}"
               th:text="${stelle.titel}">
            </a>
        </li>
    </ul>
    </body>
</html>
