<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<h1>Bewerbungen</h1>

<table border="1">

    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Telefon</th>
        <th>Stelle</th>
        <th>Status</th>
        <th>Notiz</th>
        <th>Dokumente</th>
    </tr>


    <tr th:each="bewerbung : ${bewerbungen}">

        <td th:text="${bewerbung.vorname + ' ' + bewerbung.nachname}">
        </td>

        <td th:text="${bewerbung.email}">
        </td>

        <td th:text="${bewerbung.telefon}">
        </td>

        <td th:text="${bewerbung.stelle.titel}">
        </td>

        <td>
            <form th:action="@{/bewerbungen/{id}/status(id=${bewerbung.id})}" method="post">
                <select name="neuerStatus">
                    <option th:value="EINGANG"
                            th:selected="${bewerbung.status.name() == 'EINGANG'}">
                        Eingang
                    </option>

                    <option th:value="INTERVIEW"
                            th:selected="${bewerbung.status.name() == 'INTERVIEW'}">
                        Interview
                    </option>

                    <option th:value="ANGEBOT"
                            th:selected="${bewerbung.status.name() == 'ANGEBOT'}">
                        Angebot
                    </option>

                    <option th:value="ABGELEHNT"
                            th:selected="${bewerbung.status.name() == 'ABGELEHNT'}">
                        Abgelehnt
                    </option>

                </select>

                <button type="submit">
                    Aktualisieren
                </button>

            </form>
        </td>

        <td>
            <form th:action="@{/bewerbungen/{id}/notiz(id=${bewerbung.id})}" method="post">

        <textarea name="notiz"
                  th:text="${bewerbung.notiz}"
                  placeholder="Notiz">
        </textarea>

                <button type="submit">
                    Speichern
                </button>

            </form>
        </td>

        <td>
            <div th:each="dokument : ${bewerbung.dokumente}">
                <a th:href="@{/dokument/{name}(name=${dokument.name})}"
                   th:text="${dokument.name}">
                </a>
                <br>
            </div>
        </td>

    </tr>

</table>

</body>
</html>
