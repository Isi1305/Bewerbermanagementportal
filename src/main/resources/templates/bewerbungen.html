<html xmlns:th="http://www.thymeleaf.org">

<body>

<h1>Bewerbungen</h1>

<table border="1">

    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Telefon</th>
        <th>Stelle</th>
        <th>Status</th>
        <th>Notiz</th>
    </tr>


    <tr th:each="bewerbung : ${bewerbungen}">

        <td th:text="${bewerbung.vorname + ' ' + bewerbung.nachname}">
        </td>

        <td th:text="${bewerbung.email}">
        </td>

        <td th:text="${bewerbung.telefon}">
        </td>

        <td th:text="${bewerbung.stelle.titel}">
        </td>

        <td th:text="${bewerbung.status}">
        </td>


        <td>
            <form th:action="@{/bewerbungen/{id}/notiz(id=${bewerbung.id})}" method="post">

        <textarea name="notiz"
                  th:text="${bewerbung.notiz}"
                  placeholder="Notiz">
        </textarea>

                <button type="submit">
                    Speichern
                </button>

            </form>
        </td>

    </tr>

</table>

</body>
</html>
